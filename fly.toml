# Fly.io deployment.
#
# `fly deploy --remote-only` builds on Fly's builders, so this needs no local
# Docker. The health check hits /api/facts, which reads the committed tables and
# touches no model, so a green check means the knowledge layer loaded rather than
# just that a port opened.
app = "omnipro-220-specialist"
primary_region = "sin"   # Singapore: closest region to the author.

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Kept warm. Scaling to zero saves pennies and costs a reviewer a cold start,
  # which is the wrong trade for a submission someone clicks once.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/facts"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # the committed index and figure store sit in memory
