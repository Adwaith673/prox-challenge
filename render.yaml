# Zero-config deploy for Render.
#
# No build step and no bundler: the server runs TypeScript directly through tsx,
# and the whole knowledge index is committed, so there is nothing to compile and
# nothing to extract at boot.
#
# Deliberately no ANTHROPIC_API_KEY. A public URL wired to the author's key is an
# open tap on their account, so the deployed build carries none: everything that
# does not call the model -- the verified diagrams, the three interactive
# widgets, the manual browser, the figure store and the rejected-diagram demo --
# serves without one, and asking the agent a question prompts the viewer for
# their own key, held for that request only.
#
# On `free`, because it needs no card. The catch is that free instances sleep
# after 15 minutes idle and take 30-60s to wake, which for a link someone clicks
# once is genuinely worse than no link. The fix is a keep-warm ping -- any free
# uptime checker hitting /api/facts every 10 minutes holds it open, and 750
# free hours a month covers one service running continuously. /api/facts reads
# the committed tables and calls no model, so pinging it costs nothing.
services:
  - type: web
    name: omnipro-220-specialist
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/facts
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
